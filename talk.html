<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ほんやく">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>ふたりで会話</title>
<style>
  body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .side {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 14px;
    border: 3px solid transparent; transition: border-color .2s, background .2s;
  }
  .side.turn { border-color: var(--rec); background: color-mix(in srgb, var(--rec-soft) 35%, var(--bg)); }
  /* The English speaker sits across the table, so their half is upside down. */
  .side.en { transform: rotate(180deg); }
  .side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .flag { font-size: 17px; font-weight: 700; }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px; }
  .guide { margin: auto 0; color: var(--muted); font-size: 14px; line-height: 1.7; text-align: center; }
  .guide b { color: var(--text); font-size: 15px; }
  /* What I said: small bubble. What my partner said: big translated card. */
  .mine {
    align-self: flex-end; max-width: 85%; background: var(--accent-soft); color: var(--text);
    border-radius: 14px 14px 4px 14px; padding: 6px 10px; font-size: 14px;
  }
  .mine.interim { opacity: .7; font-style: italic; }
  .card .dst { font-size: 24px; }
  .bar { display: flex; align-items: center; gap: 12px; }
  .hint { flex: 1; font-size: 15px; color: var(--muted); line-height: 1.4; }
  .side.turn .hint { color: var(--rec); font-weight: 700; }
  .mic { width: 72px; height: 72px; font-size: 28px; }
  .middle {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--card);
  }
  .middle a { color: var(--accent); text-decoration: none; font-size: 14px; white-space: nowrap; }
  .stop-btn {
    border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>
<section class="side en" id="side-en" lang="en">
  <div class="side-head"><span class="flag">🇺🇸 English</span><span class="status state">Waiting</span></div>
  <div class="log">
    <div class="guide"><b>How it works</b><br>Tap 🎤 on your side and speak English.<br>Your words are translated for your partner.<br>When they finish, it's automatically your turn.</div>
  </div>
  <div class="bar">
    <div class="hint"></div>
    <button class="mic" aria-label="Speak English">🎤</button>
  </div>
</section>

<div class="middle">
  <a href="./">← ひとりで</a>
  <span id="status" class="status">日本語 ⇄ English</span>
  <button id="stop" class="stop-btn">■ 停止</button>
  <button id="settings-btn" class="icon-btn" aria-label="設定">⚙️</button>
</div>

<section class="side ja" id="side-ja">
  <div class="side-head"><span class="flag">🇯🇵 日本語</span><span class="status state">待機中</span></div>
  <div class="log">
    <div class="guide"><b>使い方</b><br>スマホを2人の間に置き、話す人が自分側の🎤を押して話します。<br>訳は相手側に表示され、読み上げられます。<br>読み上げが終わると、自動で相手の番になります。</div>
  </div>
  <div class="bar">
    <div class="hint"></div>
    <button class="mic" aria-label="日本語で話す">🎤</button>
  </div>
</section>

<div id="sheet-bg" class="sheet-bg" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <h2>設定</h2>
    <label class="switch"><span><b>訳を読み上げる</b></span><input id="tts" type="checkbox" checked></label>
    <label class="field">
      <span>英語の聞き取り方式</span>
      <select id="accent"></select>
      <small>なまりのある英語は「AI・高精度」がおすすめです。動きが重いときは「AI・軽量」にしてください。</small>
    </label>
    <button id="sheet-close" class="primary">閉じる</button>
  </div>
</div>

<script src="dictionaries.js"></script>
<script src="core.js"></script>
<script src="whisper.js"></script>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SIDES = {
  ja: { rec: 'ja-JP', voice: 'ja-JP', other: 'en', el: document.getElementById('side-ja'),
        text: { idle: '🎤 を押して日本語で話す', turn: 'どうぞ、日本語で話してください', wait: '相手が話しています',
                stIdle: '待機中', stTurn: 'あなたの番', stWait: '相手の番', stWork: '翻訳中', stSpeak: '読み上げ中', stLoad: 'AI準備中' } },
  en: { rec: 'en-US', voice: 'en-US', other: 'ja', el: document.getElementById('side-en'),
        text: { idle: 'Tap 🎤 and speak English', turn: 'Your turn — speak English', wait: 'Your partner is speaking',
                stIdle: 'Waiting', stTurn: 'Your turn', stWait: "Partner's turn", stWork: 'Translating', stSpeak: 'Speaking', stLoad: 'Loading AI' } },
};
const statusEl = document.getElementById('status');
let turn = null;      // 'ja' | 'en' | null (stopped)
let rec = null;
let busy = false;     // translating or speaking: mic is paused
let phase = 'idle';   // idle | turn | work | speak | load
let ttsOn = true;
let interimEls = {};
let preview = null;
const buffer = makeSentenceBuffer((text, lang) => {
  preview?.cancel();
  clearInterim();
  if (!busy && turn) handleFinal(lang === 'ja' && looksEnglish(text) ? 'en' : lang, text);
});
let enMode = getEnMode();
SIDES.en.rec = systemEnLang(enMode);
setupEnModeSelect(document.getElementById('accent'), (mode) => {
  enMode = mode;
  SIDES.en.rec = systemEnLang(mode);
  whisper.setRefine(mode === 'whisper');
  if (isWhisper(mode)) whisper.preload();
  if (turn === 'en' && !busy) listen();
});

const whisper = createWhisperListener({
  onState(state, info) {
    if (!isWhisper(enMode)) return;
    if (state === 'error') {
      // Fall back to the iPhone recognizer so the conversation can go on.
      setStatus('AIが使えないため標準の聞き取りに切り替えました', 'error');
      enMode = 'en-US';
      SIDES.en.rec = 'en-US';
      document.getElementById('accent').value = 'en-US';
      if (turn === 'en' && !busy) listen();
      return;
    }
    if (turn !== 'en' || busy) return;
    if (state === 'loading') { setPhase('load'); SIDES.en.el.querySelector('.hint').textContent = 'Getting the AI ready… ' + (info || 0) + '% (first time only)'; }
    else if (state === 'listening') { setPhase('turn'); clearInterim(); }
    else if (state === 'hearing') showInterim('en', '🎙 …');
    else if (state === 'transcribing') showInterim('en', '…');
  },
  onResult(text, id) {
    if (!busy && turn === 'en') handleFinal('en', text, id);
  },
  // The accurate model heard something different: fix the message and its translation.
  async onRefine(id, text) {
    const sent = sentById[id];
    delete sentById[id];
    if (!sent || !differentWords(sent.text, text)) return;
    const { shown, query } = prepareText(text, 'en');
    sent.mine.textContent = shown;
    try {
      const t = await translate(query, 'en', 'ja');
      const dst = sent.out.querySelector('.dst');
      dst.innerHTML = '';
      dst.append(t, Object.assign(document.createElement('span'), { className: 'badge', textContent: '修正済み' }));
      sent.out.dataset.say = t;
      sent.out.classList.add('refined');
    } catch {}
  },
});
whisper.setRefine(enMode === 'whisper');
if (isWhisper(enMode)) whisper.preload();

function setStatus(text, kind = 'idle') {
  statusEl.textContent = text;
  statusEl.className = 'status ' + kind;
}

function logOf(lang) { return SIDES[lang].el.querySelector('.log'); }

function scrollDown(lang) { logOf(lang).scrollTop = logOf(lang).scrollHeight; }

// What this side's speaker said.
function addMine(lang, text) {
  logOf(lang).querySelector('.guide')?.remove();
  const div = document.createElement('div');
  div.className = 'mine';
  div.textContent = text;
  logOf(lang).appendChild(div);
  scrollDown(lang);
  return div;
}

// The partner's words, translated into this side's language.
function addTranslation(lang) {
  logOf(lang).querySelector('.guide')?.remove();
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = '<div class="dst">…</div><button class="replay" aria-label="replay">🔊</button>';
  div.querySelector('.replay').onclick = () => {
    if (!div.dataset.say || !window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(div.dataset.say);
    pickVoice(u, SIDES[lang].voice);
    speechSynthesis.speak(u);
  };
  logOf(lang).appendChild(div);
  scrollDown(lang);
  return div;
}

function showInterim(lang, text, mine = true) {
  if (!interimEls[lang]) {
    logOf(lang).querySelector('.guide')?.remove();
    const el = document.createElement('div');
    el.className = mine ? 'mine interim' : 'card interim';
    if (!mine) el.innerHTML = '<div class="dst"></div>';
    logOf(lang).appendChild(el);
    interimEls[lang] = el;
  }
  (mine ? interimEls[lang] : interimEls[lang].querySelector('.dst')).textContent = text;
  scrollDown(lang);
}

function clearInterim() {
  for (const el of Object.values(interimEls)) el.remove();
  interimEls = {};
}

function setPhase(p) { phase = p; render(); }

function render() {
  for (const [lang, s] of Object.entries(SIDES)) {
    const t = s.text;
    const mine = turn === lang;
    s.el.classList.toggle('turn', mine && phase === 'turn');
    s.el.querySelector('.mic').textContent = mine ? '■' : '🎤';
    s.el.querySelector('.mic').classList.toggle('rec', mine && phase === 'turn');
    const hint = s.el.querySelector('.hint');
    const st = s.el.querySelector('.state');
    let label = t.stIdle, kind = 'idle';
    if (!turn) hint.textContent = t.idle;
    else if (phase === 'work') { label = t.stWork; kind = 'working'; hint.textContent = ''; }
    else if (phase === 'speak') { label = t.stSpeak; kind = 'speaking'; hint.textContent = ''; }
    else if (mine && phase === 'load') { label = t.stLoad; kind = 'loading'; }
    else if (mine) { label = t.stTurn; kind = 'listening'; hint.textContent = t.turn; }
    else { label = t.stWait; hint.textContent = t.wait; }
    st.textContent = label;
    st.className = 'status state ' + kind;
  }
  if (!statusEl.classList.contains('error')) {
    setStatus(turn ? (turn === 'ja' ? '日本語 → English' : 'English → 日本語') : '日本語 ⇄ English', turn ? 'working' : 'idle');
  }
}

// The Japanese recognizer writes English speech in Latin letters, so if the
// Japanese side hears mostly Latin letters, treat it as English.
function looksEnglish(text) {
  const letters = text.replace(/[\s\d.,!?'-]/g, '');
  if (!letters) return false;
  const latin = (letters.match(/[A-Za-z]/g) || []).length;
  return latin / letters.length > 0.6;
}

function listen() {
  if (!turn) return;
  rec?.abort();
  rec = null;
  whisper.stop();
  const lang = turn;
  preview?.cancel();
  setPhase('turn');
  if (lang === 'en' && isWhisper(enMode)) { whisper.start(); return; }
  const other = SIDES[lang].other;
  preview = makeLivePreview(lang, other, (t) => { if (!busy && turn === lang) showInterim(other, t, false); });
  const r = rec = new SR();
  rec.lang = SIDES[lang].rec;
  rec.interimResults = true;
  rec.continuous = true;
  rec.onresult = (e) => {
    if (busy || turn !== lang) return;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      const text = r[0].transcript.trim();
      if (r.isFinal) {
        if (text) buffer.final(text, lang);
      } else {
        interim += text;
      }
    }
    if (interim) buffer.interim(interim, lang);
    const shown = buffer.text();
    if (shown) {
      showInterim(lang, shown);
      preview.update(normalizeSpeech(shown, lang));
    }
  };
  rec.onerror = (e) => {
    if (e.error !== 'no-speech' && e.error !== 'aborted') debugLog('recognition error (' + lang + '): ' + e.error, true);
    if (e.error === 'not-allowed') {
      stopAll();
      setStatus('マイクが許可されていません', 'error');
    }
  };
  // Safari stops recognition after a pause, so restart while it's still this side's turn.
  rec.onend = () => {
    buffer.rearm();
    if (rec === r && turn === lang && !busy) { try { r.start(); } catch {} }
  };
  try { rec.start(); } catch {}
}

const sentById = {};

async function handleFinal(from, text, id) {
  const to = SIDES[from].other;
  busy = true;
  rec?.abort();
  whisper.stop();
  clearInterim();
  setPhase('work');
  const { shown, query } = prepareText(text, from);
  const mine = addMine(from, shown);
  const out = addTranslation(to);
  if (id !== undefined) sentById[id] = { text, mine, out };
  let translated = '';
  try {
    translated = await translate(query, from, to);
    out.querySelector('.dst').textContent = translated;
    out.dataset.say = translated;
    scrollDown(to);
  } catch (err) {
    out.querySelector('.dst').textContent = to === 'en' ? '(Could not translate)' : '（翻訳できませんでした）';
    debugLog('translate error: ' + err.message, true);
  }
  if (!turn) { busy = false; return; }
  // Hand the turn to the listener once the translation has been read out.
  const next = () => {
    busy = false;
    if (!turn) return;
    turn = to;
    listen();
  };
  if (!translated || !ttsOn || !window.speechSynthesis) return next();
  setPhase('speak');
  const u = new SpeechSynthesisUtterance(translated);
  pickVoice(u, SIDES[to].voice);
  u.onend = next;
  u.onerror = next;
  speechSynthesis.speak(u);
}

function stopAll() {
  turn = null;
  buffer.clear();
  preview?.cancel();
  busy = false;
  rec?.abort();
  rec = null;
  whisper.stop();
  window.speechSynthesis?.cancel();
  clearInterim();
  setStatus('日本語 ⇄ English');
  setPhase('idle');
}

for (const lang of ['ja', 'en']) {
  SIDES[lang].el.querySelector('.mic').onclick = () => {
    if (!SR) { setStatus('iPhoneのSafariで開いてください', 'error'); return; }
    if (turn === lang) return stopAll();
    unlockSpeech();
    whisper.prime();
    window.speechSynthesis?.cancel();
    busy = false;
    buffer.clear();
    clearInterim();
    setStatus('');
    turn = lang;
    listen();
  };
}
document.getElementById('stop').onclick = stopAll;

const sheetBg = document.getElementById('sheet-bg');
document.getElementById('settings-btn').onclick = () => { sheetBg.hidden = false; };
document.getElementById('sheet-close').onclick = () => { sheetBg.hidden = true; };
sheetBg.onclick = (e) => { if (e.target === sheetBg) sheetBg.hidden = true; };
document.getElementById('tts').onchange = (e) => {
  ttsOn = e.target.checked;
  if (!ttsOn) window.speechSynthesis?.cancel();
};
render();
</script>
</body>
</html>
