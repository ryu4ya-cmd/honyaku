<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ほんやく">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>リアルタイム翻訳</title>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --accent: #2563eb; --rec: #dc2626; --border: #e2e8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1120; --card: #111827; --text: #f1f5f9; --muted: #94a3b8; --border: #1f2937; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
  h1 { font-size: 18px; margin: 0; }
  .lang {
    display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden;
  }
  .lang button {
    border: 0; background: transparent; color: var(--text); padding: 8px 14px; font-size: 14px;
  }
  .lang button.on { background: var(--accent); color: #fff; }
  #talk { color: var(--accent); font-size: 14px; text-decoration: none; }
  .controls { display: flex; gap: 8px; align-items: center; }
  #tts {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 999px; padding: 6px 10px; font-size: 16px;
  }
  #tts.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .src { color: var(--muted); font-size: 14px; }
  .dst { font-size: 20px; margin-top: 4px; }
  .interim { color: var(--muted); font-style: italic; }
  #status { text-align: center; color: var(--muted); font-size: 13px; min-height: 1.4em; }
  .accent {
    display: block; margin: 0 auto; font-size: 14px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px;
  }
  #mic {
    margin: 8px auto 16px; width: 72px; height: 72px; border-radius: 50%; border: 0;
    background: var(--accent); color: #fff; font-size: 30px;
  }
  #mic.rec { background: var(--rec); }
  .empty { color: var(--muted); text-align: center; margin-top: 30vh; }
</style>
</head>
<body>
<header>
  <h1>リアルタイム翻訳</h1>
  <a id="talk" href="talk.html">対面モード</a>
  <div class="controls">
    <button id="tts" class="on" aria-label="読み上げ">🔊</button>
    <div class="lang" role="group" aria-label="話す言語">
      <button id="ja" class="on">日→英</button>
      <button id="en">英→日</button>
    </div>
  </div>
</header>
<div id="log"><p class="empty">マイクボタンを押して話してください</p></div>
<div id="status"></div>
<select id="accent" class="accent" aria-label="英語のなまり"></select>
<button id="mic" aria-label="録音開始">🎤</button>

<script src="core.js"></script>
<script src="whisper.js"></script>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const mic = document.getElementById('mic');
const LANGS = {
  ja: { rec: 'ja-JP', from: 'ja', to: 'en', voice: 'en-US' },
  en: { rec: 'en-US', from: 'en', to: 'ja', voice: 'ja-JP' },
};
let current = 'ja';
let rec = null;
let listening = false;
let interimEl = null;
let ttsOn = true;
let speaking = 0;
let enMode = getEnMode();
LANGS.en.rec = systemEnLang(enMode);
setupEnModeSelect(document.getElementById('accent'), (mode) => {
  enMode = mode;
  LANGS.en.rec = systemEnLang(mode);
  if (mode === 'whisper') whisper.preload();
  if (listening && current === 'en') { stop(); start(); }
});
let buffer = null;
let handleText = null;
let preview = null;
let previewEl = null;

function useWhisper() { return current === 'en' && enMode === 'whisper'; }

const whisper = createWhisperListener({
  onState(state, info) {
    if (enMode !== 'whisper') return;
    if (state === 'error') {
      setStatus('AI認識エラー：標準の認識に切り替えました');
      enMode = 'en-US';
      LANGS.en.rec = 'en-US';
      document.getElementById('accent').value = 'en-US';
      if (listening && current === 'en') { stop(); start(); setStatus('AI認識エラー：標準の認識に切り替えました'); }
      return;
    }
    if (!listening || !useWhisper()) return;
    if (state === 'loading') setStatus('AIモデルを読み込み中… ' + (info || 0) + '%（初回のみ）');
    else if (state === 'listening') { setStatus('聞き取り中…（AI）'); clearInterim(); }
    else if (state === 'hearing') showInterim('🎙 …');
    else if (state === 'transcribing') showInterim('…');
  },
  onResult(text) { if (listening && useWhisper()) handleText(text); },
});
if (enMode === 'whisper') whisper.preload();

function setStatus(t) { statusEl.textContent = t; }

function addItem(src) {
  log.querySelector('.empty')?.remove();
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = '<div class="src"></div><div class="dst">…</div>';
  div.querySelector('.src').textContent = src;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div.querySelector('.dst');
}

function showInterim(text) {
  log.querySelector('.empty')?.remove();
  if (!interimEl) {
    interimEl = document.createElement('div');
    interimEl.className = 'item interim';
    interimEl.innerHTML = '<div class="src"></div>';
    log.appendChild(interimEl);
  }
  interimEl.querySelector('.src').textContent = text;
  log.scrollTop = log.scrollHeight;
}

function clearInterim() { interimEl?.remove(); interimEl = null; previewEl = null; }

function showPreview(text) {
  if (!interimEl) return;
  if (!previewEl) {
    previewEl = document.createElement('div');
    previewEl.className = 'dst';
    interimEl.appendChild(previewEl);
  }
  previewEl.textContent = text;
}

function speak(text, lang) {
  if (!ttsOn || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  pickVoice(u, lang);
  // Pause the mic while speaking so the app doesn't hear its own voice.
  speaking++;
  rec?.abort();
  whisper.stop();
  const done = () => {
    speaking = Math.max(0, speaking - 1);
    if (speaking || !listening) return;
    if (useWhisper()) whisper.start();
    else { try { rec.start(); } catch {} }
  };
  u.onend = done;
  u.onerror = done;
  speechSynthesis.speak(u);
}

function start() {
  const { from, to, voice } = LANGS[current];
  handleText = (text) => {
    preview?.cancel();
    clearInterim();
    // Drop Safari's late final result for these same words.
    if (rec) { rec.abort(); }
    const { shown, query } = prepareText(text, from);
    const dst = addItem(shown);
    translate(query, from, to)
      .then(t => { dst.textContent = t; speak(t, voice); })
      .catch(err => { dst.textContent = '（翻訳エラー：' + err.message + '）'; });
  };
  if (useWhisper()) {
    listening = true;
    whisper.start();
    mic.classList.add('rec');
    mic.textContent = '■';
    return;
  }
  if (!SR) { setStatus('このブラウザは音声認識に対応していません。iPhoneのSafariで開いてください。'); return; }
  rec = new SR();
  rec.lang = LANGS[current].rec;
  rec.interimResults = true;
  rec.continuous = true;
  buffer?.clear();
  buffer = makeSentenceBuffer(handleText);
  preview?.cancel();
  preview = makeLivePreview(from, to, (t) => showPreview(t));

  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      const text = r[0].transcript.trim();
      if (r.isFinal) {
        if (text) buffer.final(text, from);
      } else {
        interim += text;
      }
    }
    if (interim) buffer.interim(interim, from);
    const shownNow = buffer.text();
    if (shownNow) {
      showInterim(shownNow);
      preview.update(from === 'ja' ? normalizeDialect(shownNow) : shownNow);
    }
  };
  rec.onerror = (e) => {
    if (e.error === 'not-allowed') {
      setStatus('マイクが許可されていません。設定でSafariのマイクと音声入力（Siri）を有効にしてください。');
      stop();
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      setStatus('エラー：' + e.error);
    }
  };
  // Safari stops recognition after a pause, so restart while still listening.
  const r = rec;
  rec.onend = () => {
    buffer.rearm();
    if (rec === r && listening && !speaking) { try { rec.start(); } catch {} }
  };

  listening = true;
  rec.start();
  mic.classList.add('rec');
  mic.textContent = '■';
  setStatus('聞き取り中…');
}

function stop() {
  listening = false;
  speaking = 0;
  buffer?.clear();
  preview?.cancel();
  window.speechSynthesis?.cancel();
  rec?.stop();
  rec = null;
  whisper.stop();
  clearInterim();
  mic.classList.remove('rec');
  mic.textContent = '🎤';
  setStatus('');
}

mic.onclick = () => {
  // iOS only allows speech output after a tap, so unlock it here.
  if (!listening && ttsOn) unlockSpeech();
  whisper.prime();
  listening ? stop() : start();
};

const ttsBtn = document.getElementById('tts');
ttsBtn.onclick = () => {
  ttsOn = !ttsOn;
  ttsBtn.classList.toggle('on', ttsOn);
  ttsBtn.textContent = ttsOn ? '🔊' : '🔇';
  if (!ttsOn) window.speechSynthesis?.cancel();
};

for (const id of ['ja', 'en']) {
  document.getElementById(id).onclick = () => {
    current = id;
    document.getElementById('ja').classList.toggle('on', id === 'ja');
    document.getElementById('en').classList.toggle('on', id === 'en');
    if (listening) { stop(); start(); }
  };
}
</script>
</body>
</html>
