<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ほんやく">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>ほんやく</title>
<style>
  body {
    display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) 16px 0;
  }
  .direction {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 10px; box-shadow: var(--shadow);
  }
  .lang-box { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .lang-box .label { font-size: 12px; color: var(--muted); }
  .lang-box .name { font-size: 18px; font-weight: 700; }
  .swap {
    width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent);
    font-size: 22px; font-weight: 700;
  }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px 0; }
  .guide {
    margin: auto 0; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px;
  }
  .guide b { font-size: 16px; }
  .guide ol { margin: 8px 0 0; padding-left: 20px; line-height: 1.9; font-size: 15px; }
  .bottom {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 8px 0 calc(12px + env(safe-area-inset-bottom));
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">ほんやく</div>
  <nav class="tabs"><div class="seg"><a class="on" href="./">ひとりで</a><a href="talk.html">ふたりで会話</a></div></nav>
  <button id="settings-btn" class="icon-btn" aria-label="設定">⚙️</button>
</header>

<section class="direction" aria-label="翻訳の向き">
  <div class="lang-box"><span class="label">話す言葉</span><span id="from-name" class="name"></span></div>
  <button id="swap" class="swap" aria-label="話す言葉と訳す言葉を入れ替える">⇄</button>
  <div class="lang-box"><span class="label">訳す言葉</span><span id="to-name" class="name"></span></div>
</section>

<main id="log" aria-live="polite">
  <div class="guide">
    <b>使い方</b>
    <ol>
      <li>上で「話す言葉」を確認（⇄ で入れ替え）</li>
      <li>下のマイクを押して話す</li>
      <li>訳が大きく表示され、読み上げられます</li>
    </ol>
  </div>
</main>

<footer class="bottom">
  <div id="status" class="status">待機中</div>
  <button id="mic" class="mic" aria-label="話し始める">🎤</button>
  <div id="mic-label" class="mic-label">タップして話す</div>
</footer>

<div id="sheet-bg" class="sheet-bg" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <h2>設定</h2>
    <label class="switch"><span><b>訳を読み上げる</b></span><input id="tts" type="checkbox" checked></label>
    <label class="field">
      <span>読み上げの速さ</span>
      <select id="rate"></select>
    </label>
    <label class="field">
      <span>周りの音のカット</span>
      <select id="noise"></select>
      <small>周りの声や雑音を拾うときは「強め」に。小さい声が拾われにくくなったら「標準」に戻してください。</small>
    </label>
    <label class="field">
      <span>英語の聞き取り方式</span>
      <select id="accent"></select>
      <small>ふだんは「iPhone標準」が一番速く、話しながら訳が出ます。強いなまりが聞き取れないときだけ「AI」を試してください（話し終わってから訳が出るので遅め、初回はダウンロードあり）。</small>
    </label>
    <button id="sheet-close" class="primary">閉じる</button>
  </div>
</div>

<script src="dictionaries.js"></script>
<script src="core.js"></script>
<script src="whisper.js"></script>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const mic = document.getElementById('mic');
const micLabel = document.getElementById('mic-label');
const LANGS = {
  ja: { rec: 'ja-JP', from: 'ja', to: 'en', voice: 'en-US', name: '🇯🇵 日本語' },
  en: { rec: 'en-US', from: 'en', to: 'ja', voice: 'ja-JP', name: '🇺🇸 英語' },
};
let current = 'ja';
let rec = null;
let listening = false;
let interimEl = null;
let ttsOn = true;
let speaking = 0;
let enMode = getEnMode();
LANGS.en.rec = systemEnLang(enMode);
setupEnModeSelect(document.getElementById('accent'), (mode) => {
  enMode = mode;
  LANGS.en.rec = systemEnLang(mode);
  whisper.setRefine(mode === 'whisper');
  if (isWhisper(mode) && current === 'en') whisper.preload();
  if (listening && current === 'en') { stop(); start(); }
});
let buffer = null;
let handleText = null;
let preview = null;
let previewEl = null;

// Until the AI has loaded, English is heard by the iPhone recognizer so there is no wait.
function useWhisper() { return current === 'en' && isWhisper(enMode) && whisper.ready; }

// The AI finished loading while English was being heard the standard way: switch over between sentences.
function switchToWhisper() {
  if (!listening || current !== 'en' || !useWhisper() || !rec) return;
  if (speaking || buffer?.text()) { setTimeout(switchToWhisper, 1000); return; }
  debugLog('switching to AI listening');
  stop(true);
  start();
}

// kind: idle | listening | working | speaking | loading | error
function setStatus(text, kind = 'idle') {
  statusEl.textContent = text;
  statusEl.className = 'status ' + kind;
}

function listeningStatus() {
  if (!listening) return setStatus('待機中');
  setStatus(LANGS[current].name.split(' ')[1] + 'を聞いています', 'listening');
}

const whisper = createWhisperListener({
  onState(state, info) {
    if (!isWhisper(enMode)) return;
    if (state === 'error') {
      enMode = 'en-US';
      LANGS.en.rec = 'en-US';
      document.getElementById('accent').value = 'en-US';
      if (listening && current === 'en') { stop(); start(); }
      setStatus('AIが使えないため標準の聞き取りに切り替えました', 'error');
      return;
    }
    if (state === 'ready') { switchToWhisper(); return; }
    if (state === 'loading' && listening && current === 'en' && rec && !speaking) {
      setStatus('英語を聞いています（AI準備中 ' + (info || 0) + '%）', 'listening');
      return;
    }
    if (!listening || !useWhisper()) return;
    if (state === 'loading') setStatus('AIを準備中 ' + (info || 0) + '%（初回のみ）', 'loading');
    else if (state === 'listening') { listeningStatus(); clearInterim(); }
    else if (state === 'hearing') showInterim('🎙 …');
    else if (state === 'transcribing') { showInterim('…'); setStatus('聞き取った内容を変換中', 'working'); }
  },
  onResult(text, id) { if (listening && useWhisper()) handleText(text, id); },
  // The accurate model heard something different: fix the line and its translation.
  async onRefine(id, text) {
    const item = itemById[id];
    delete itemById[id];
    if (!item || !differentWords(item.text, text)) return;
    const { shown, query } = prepareText(text, 'en');
    item.el.querySelector('.src').textContent = shown;
    try {
      const t = await translate(query, 'en', 'ja');
      item.el.querySelector('.dst').innerHTML = '';
      item.el.querySelector('.dst').append(t, Object.assign(document.createElement('span'), { className: 'badge', textContent: '修正済み' }));
      item.el.dataset.say = t;
      item.el.classList.add('refined');
    } catch {}
  },
});
// The AI is loaded only once English is chosen, to save memory.
whisper.setRefine(enMode === 'whisper');

function scrollDown() { log.scrollTop = log.scrollHeight; }

function addItem(src, voice) {
  log.querySelector('.guide')?.remove();
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = '<div class="src"></div><div class="dst">…</div><button class="replay" aria-label="もう一度読み上げる">🔊</button>';
  div.querySelector('.src').textContent = src;
  div.querySelector('.replay').onclick = () => { if (div.dataset.say) speak(div.dataset.say, voice, true); };
  log.appendChild(div);
  scrollDown();
  return div;
}

const itemById = {};

// Safari can deliver the final result for words we already translated
// (from the in-progress text) a moment later; don't translate them twice.
let lastFlush = null;
function isLateDuplicate(text) {
  if (!lastFlush || Date.now() - lastFlush.at > 4000) return false;
  const norm = (s) => s.replace(/[\s、。,.!?？！]/g, '').toLowerCase();
  const a = norm(text), b = norm(lastFlush.text);
  return a === b || b.includes(a) || a.includes(b);
}

function showInterim(text) {
  log.querySelector('.guide')?.remove();
  if (!interimEl) {
    interimEl = document.createElement('div');
    interimEl.className = 'card interim';
    interimEl.innerHTML = '<div class="src"></div>';
    log.appendChild(interimEl);
  }
  interimEl.querySelector('.src').textContent = text;
  scrollDown();
}

function clearInterim() { interimEl?.remove(); interimEl = null; previewEl = null; }

function showPreview(text) {
  if (!interimEl) return;
  if (!previewEl) {
    previewEl = document.createElement('div');
    previewEl.className = 'dst';
    interimEl.appendChild(previewEl);
  }
  previewEl.textContent = text;
  scrollDown();
}

function speak(text, lang, force) {
  if ((!ttsOn && !force) || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  pickVoice(u, lang);
  // Pause the mic while speaking so the app doesn't hear its own voice.
  speaking++;
  rec?.abort();
  whisper.stop();
  if (listening) setStatus('読み上げ中', 'speaking');
  const done = () => {
    speaking = Math.max(0, speaking - 1);
    if (speaking || !listening) return;
    listeningStatus();
    if (useWhisper()) whisper.start();
    else { try { rec.start(); } catch {} }
  };
  u.onend = done;
  u.onerror = done;
  speechSynthesis.speak(u);
}

function renderDirection() {
  document.getElementById('from-name').textContent = LANGS[current].name;
  document.getElementById('to-name').textContent = LANGS[LANGS[current].to].name;
}

function setMicUi(on) {
  mic.classList.toggle('rec', on);
  mic.textContent = on ? '■' : '🎤';
  mic.setAttribute('aria-label', on ? '止める' : '話し始める');
  micLabel.textContent = on ? 'タップして止める' : 'タップして話す';
}

function start() {
  const { from, to, voice } = LANGS[current];
  handleText = (text, id) => {
    preview?.cancel();
    clearInterim();
    // Drop Safari's late final result for these same words.
    lastFlush = { text, at: Date.now() };
    if (rec) rec.abort();
    if (isNoiseText(text)) { debugLog('ignored as noise: ' + text); listeningStatus(); return; }
    const { shown, query } = prepareText(text, from);
    const item = addItem(shown, voice);
    const dst = item.querySelector('.dst');
    if (id !== undefined) itemById[id] = { text, el: item };
    setStatus('翻訳中', 'working');
    translate(query, from, to)
      .then(t => { dst.textContent = t; item.dataset.say = t; scrollDown(); listeningStatus(); speak(t, voice); })
      .catch(err => { dst.textContent = '（翻訳できませんでした）'; debugLog('translate error: ' + err.message, true); listeningStatus(); });
  };
  if (current === 'en' && isWhisper(enMode)) whisper.preload();
  if (useWhisper()) {
    listening = true;
    setMicUi(true);
    listeningStatus();
    whisper.start();
    return;
  }
  if (!SR) { setStatus('iPhoneのSafariで開いてください', 'error'); return; }
  rec = new SR();
  rec.lang = LANGS[current].rec;
  rec.interimResults = true;
  rec.continuous = true;
  buffer?.clear();
  // On a pause, ask Safari to finish so we get its more accurate final text.
  buffer = makeSentenceBuffer(handleText, () => { try { rec?.stop(); } catch {} });
  preview?.cancel();
  preview = makeLivePreview(from, to, (t) => showPreview(t));

  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      const text = r[0].transcript.trim();
      if (r.isFinal) {
        if (isNoiseResult(r[0])) { debugLog('ignored as noise (low confidence): ' + text); buffer.drop(); }
        else if (text && !isLateDuplicate(text)) buffer.final(text, from);
      } else {
        interim += text;
      }
    }
    if (interim) buffer.interim(interim, from);
    const shownNow = buffer.text();
    if (shownNow) {
      showInterim(shownNow);
      preview.update(normalizeSpeech(shownNow, from));
    } else { preview.cancel(); clearInterim(); }
  };
  rec.onerror = (e) => {
    if (e.error === 'not-allowed') {
      setStatus('マイクが許可されていません（設定 → Safari → マイク、Siriをオン）', 'error');
      stop(true);
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      setStatus('聞き取りエラー：' + e.error, 'error');
      debugLog('recognition error: ' + e.error, true);
    }
  };
  // Safari stops recognition after a pause, so restart while still listening.
  const r = rec;
  rec.onend = () => {
    buffer.rearm();
    if (rec === r && listening && !speaking) { try { rec.start(); } catch {} }
  };

  listening = true;
  rec.start();
  setMicUi(true);
  listeningStatus();
}

function stop(keepStatus) {
  listening = false;
  speaking = 0;
  buffer?.clear();
  preview?.cancel();
  window.speechSynthesis?.cancel();
  rec?.stop();
  rec = null;
  whisper.stop();
  clearInterim();
  setMicUi(false);
  if (!keepStatus) setStatus('待機中');
}

mic.onclick = () => {
  // iOS only allows speech output after a tap, so unlock it here.
  if (!listening && ttsOn) unlockSpeech();
  whisper.prime();
  listening ? stop() : start();
};

document.getElementById('swap').onclick = () => {
  current = LANGS[current].to;
  renderDirection();
  if (useWhisper()) whisper.preload();
  if (listening) { stop(); start(); }
};

const sheetBg = document.getElementById('sheet-bg');
document.getElementById('settings-btn').onclick = () => { sheetBg.hidden = false; };
document.getElementById('sheet-close').onclick = () => { sheetBg.hidden = true; };
sheetBg.onclick = (e) => { if (e.target === sheetBg) sheetBg.hidden = true; };
document.getElementById('tts').onchange = (e) => {
  ttsOn = e.target.checked;
  if (!ttsOn) window.speechSynthesis?.cancel();
};

setupRateSelect(document.getElementById('rate'));
setupNoiseSelect(document.getElementById('noise'));
renderDirection();
</script>
</body>
</html>
